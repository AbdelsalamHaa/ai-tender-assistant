[project]
name = "ml_service"
version = "0.1.0"
description = "ML/AI Service for PDF ingestion and processing using LlamaIndex"
requires-python = ">=3.11"
dependencies = [
    # FastAPI & Server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    
    # LlamaIndex Core
    "llama-index>=0.12.0",
    "llama-index-core>=0.12.0",
    "llama-index-embeddings-openai>=0.3.0",
    "llama-index-llms-openai>=0.3.0",
    "llama-index-vector-stores-postgres>=0.4.0",
    "llama-index-readers-file>=0.4.0",
    
    # Database
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.0",
    "pgvector>=0.3.0",
    "alembic>=1.14.0",
    
    # Celery & Redis
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    
    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ml_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

